# Local development environment for calculaud (backend + frontend).
#
# Expects both repositories side by side in the same folder:
#   <folder>/calculaud-be   (this repo)
#   <folder>/calculaud-fe
#
# Start:  docker compose up -d --build      (run inside calculaud-be)
# Stop:   docker compose down
# Reset:  docker compose down -v             (also deletes the local database and files)
#
# Login is bypassed (BYPASS_AUTH) and files are stored in a local MinIO instead of AWS S3.
# This setup is for local development only. Do not use these settings in production.

name: calculaud

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calculaud
      POSTGRES_PASSWORD: calculaud
      POSTGRES_DB: calculaud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calculaud -d calculaud"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: calculaud
      MINIO_ROOT_PASSWORD: calculaud-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 calculaud calculaud-local; do sleep 2; done;
      mc mb --ignore-existing local/calculaud-files;
      echo 'bucket ready';
      "
    restart: "no"

  api:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql://calculaud:calculaud@db:5432/calculaud
      ENVIRONMENT: development
      DEBUG: "true"
      BYPASS_AUTH: "true"
      # Required by the settings class; not used while BYPASS_AUTH is on.
      AUTH_JWKS_URL: http://localhost/unused/jwks.json
      AUTH_ISSUER: http://localhost/unused
      AUTH_TOKEN_ENDPOINT_URL: http://localhost/unused/token
      AUTH_OIDC_URL: http://localhost/unused/.well-known/openid-configuration
      # Local S3 (MinIO). host.docker.internal is reachable from both the container and the browser on Docker Desktop.
      AWS_ACCESS_KEY_ID: calculaud
      AWS_SECRET_ACCESS_KEY: calculaud-local
      AWS_REGION: us-east-1
      S3_ENDPOINT_URL: http://host.docker.internal:9000
      S3_USE_SSL: "false"
      S3_BUCKET_NAME: calculaud-files
      S3_BUCKET_URL: http://host.docker.internal:9000/calculaud-files
      WATCHFILES_FORCE_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_BYPASS_AUTH: "true"
      VITE_DEV_SERVER_HOST: 0.0.0.0
      VITE_DEV_SERVER_PORT: "8080"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "8080:8080"
    volumes:
      - ../calculaud-fe:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  pgdata:
  miniodata:
  web_node_modules:
